{% extends "spot/layout.html" %}
{% load static %}

{% block title %} Classifier {% endblock %}

{% block body %}
    {% if is_authenticated == False %}
    <div class="main_index-info">
        <img src="{% static 'spot/images/detective_dog.png' %}" alt="detective_dog" class="main-img1">
        <div class="index_info">
            <div class="main_index-text">
                <h2>Start rating your favorite music!</h2>
                <a href="{% url 'login' %}">Login</a>
            </div>
            <img src="{% static 'spot/images/albums.jpg' %}" alt="albums" class="main-img2">
        </div>
    </div>
    {% else %}
    
        <div class="lastfm-section">
            <div class="synchronize_lastfm">
                <h3>Please synchronize last_fm to start rating your favorite albums</h3>
                <a href="{% url 'synchLastfm' %}">Sync</a>
            </div>
        </div>

        <div class="synch_bg-cover"></div>
        <img src="{% static 'spot/images/wallpaper_albums.jpg' %}" alt="albums" class="bg_synch-img">       

    {% endif %}

{% endblock %}
